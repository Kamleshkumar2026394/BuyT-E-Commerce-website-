{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Admin Password - BuyT</title>

    <link rel="stylesheet"
          href="{% static 'admin-login.css' %}">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>BuyT</h1>

        <p class="admin-title">
            Admin Panel
        </p>

        <h2>Reset Password</h2>

        <p>
            Create your new admin password.
        </p>

        {% if message %}

            <div class="error-message">
                {{ message }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <label>New Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter new password"
                    required
                >

            </div>

            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>

</div>

</body>

</html>
