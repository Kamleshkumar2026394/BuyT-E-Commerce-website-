{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product - BuyT Admin</title>

    <link rel="stylesheet"
          href="{% static 'admin.css' %}">

</head>

<body>

<div class="admin-container">

    <aside class="sidebar">

        <div class="logo">
            BuyT
            <span>Admin</span>
        </div>

        <nav>

            <a href="{% url 'admin_dashboard' %}">
                📊 Dashboard
            </a>

            <a href="{% url 'admin_users' %}">
                👤 Users
            </a>

            <a href="{% url 'admin_products' %}" class="active">
                📦 Products
            </a>

            <a href="{% url 'admin_categories' %}">
                🏷️ Categories
            </a>

            <a href="{% url 'admin_brands' %}">
                🔖 Brands
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="{% url 'admin_logout' %}">
                🚪 Logout
            </a>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Edit Product</h1>

                <p>Update product information</p>

            </div>

        </header>


        <section class="form-section">

            <div class="form-card">

                <form method="POST"
                      enctype="multipart/form-data">

                    {% csrf_token %}


                    <div class="form-group">

                        <label>Product Name</label>

                        <input
                            type="text"
                            name="name"
                            value="{{ product.name }}"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>Price</label>

                            <input
                                type="number"
                                name="price"
                                step="0.01"
                                value="{{ product.price }}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>Stock</label>

                            <input
                                type="number"
                                name="stock"
                                min="0"
                                value="{{ product.stock }}"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>Rating</label>

                            <input
                                type="number"
                                name="rating"
                                step="0.1"
                                min="0"
                                max="9.9"
                                value="{{ product.rating }}"
                            >

                        </div>


                        <div class="form-group">

                            <label>Reviews</label>

                            <input
                                type="number"
                                name="reviews"
                                min="0"
                                value="{{ product.reviews }}"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label>Brand</label>

                        <select name="brand_id" required>

                            {% for item in brands %}

                                <option
                                    value="{{ item.id }}"
                                    {% if item.id == product.brand_id %}
                                        selected
                                    {% endif %}
                                >

                                    {{ item.brand_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Category</label>

                        <select name="category_id" required>

                            {% for item in categories %}

                                <option
                                    value="{{ item.id }}"
                                    {% if item.id == product.category_id %}
                                        selected
                                    {% endif %}
                                >

                                    {{ item.category_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Description</label>

                        <textarea
                            name="description"
                            rows="6"
                            required
                        >{{ product.description }}</textarea>

                    </div>


                    <div class="form-group">

                        <label>Current Image</label>

                        {% if product.image %}

                            <img
                                src="{{ product.image.url }}"
                                class="preview-image"
                                alt="{{ product.name }}"
                            >

                        {% endif %}

                    </div>


                    <div class="form-group">

                        <label>Change Image</label>

                        <input
                            type="file"
                            name="image"
                            accept="image/*"
                        >

                    </div>


                    <div class="form-actions">

                        <a
                            href="{% url 'admin_products' %}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            💾 Update Product

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>

</body>

</html>
