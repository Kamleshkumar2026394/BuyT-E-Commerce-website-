{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Brand - BuyT Admin</title>

    <link rel="stylesheet"
          href="{% static 'admin.css' %}">

</head>

<body>

<div class="admin-container">

    <aside class="sidebar">

        <div class="logo">
            BuyT
            <span>Admin</span>
        </div>

        <nav>

            <a href="{% url 'admin_dashboard' %}">
                📊 Dashboard
            </a>

            <a href="{% url 'admin_users' %}">
                👤 Users
            </a>

            <a href="{% url 'admin_products' %}">
                📦 Products
            </a>

            <a href="{% url 'admin_categories' %}">
                🏷️ Categories
            </a>

            <a href="{% url 'admin_brands' %}" class="active">
                🔖 Brands
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="{% url 'admin_logout' %}">
                🚪 Logout
            </a>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Add Brand</h1>

                <p>Create a new product brand</p>

            </div>

        </header>


        <section class="form-section">

            <div class="form-card">

                <form
                    method="POST"
                    enctype="multipart/form-data">

                    {% csrf_token %}


                    <div class="form-group">

                        <label>Brand Name</label>

                        <input
                            type="text"
                            name="brand_name"
                            placeholder="Enter brand name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Brand Image</label>

                        <input
                            type="file"
                            name="brand_image"
                            accept="image/*"
                            required
                        >

                    </div>


                    <div class="form-actions">

                        <a
                            href="{% url 'admin_brands' %}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            ➕ Add Brand

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>

</body>

</html>
