{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Forgot Password - BuyT</title>

    <link rel="stylesheet"
          href="{% static 'admin-login.css' %}">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>BuyT</h1>

        <p class="admin-title">
            Admin Panel
        </p>

        <h2>Forgot Password</h2>

        <p>
            Enter your registered admin email.
        </p>

        {% if message %}

            <div class="error-message">
                {{ message }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>

            <button type="submit">
                Send OTP
            </button>

        </form>

        <div class="forgot-password">

            <a href="{% url 'admin_login' %}">
                ← Back to Admin Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
